; PlatformIO Project Configuration File
;
; Moon Phase - WiFi + NTP time + NASA moon-phase API
; Target: Seeed Studio XIAO ESP32C3 + GC9A01 240x240 round SPI display
; Credit to nishad2m8 https://github.com/nishad2m8
; !! IMPORTANT !!
; The TFT_* pin numbers below match the confirmed working wiring.
; Wi-Fi, location, and time zone are configured through the setup access point.

[env:esp32dev]
platform = espressif32@6.5.0
board = seeed_xiao_esp32c3
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lvgl/lvgl @ 8.3.11
    bodmer/TFT_eSPI @ 2.5.43
    bblanchon/ArduinoJson @ ^6.21.5

build_flags =
    ; ---- LVGL config ----
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    -DDISABLE_ALL_LIBRARY_WARNINGS

    ; ---- TFT_eSPI setup (build-flag method, no library files edited) ----
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_RGB_ORDER=0          ; 1=BGR, 0=RGB -- flip this if colors look swapped

    ; --- pins (round GC9A01, no MISO) ---
    -DTFT_MOSI=6
    -DTFT_SCLK=7
    -DTFT_CS=4
    -DTFT_DC=5
    -DTFT_RST=3
    -DTFT_BL=-1                ; backlight always on, no pin used
    -DTFT_MISO=-1              ; not used, display has no read pin wired

    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000
